<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHopper - Planificateur de Cibles</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        h1, h2 { color: #ff5252; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #bbb; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .date-group { display: flex; gap: 5px; }
        button { width: 100%; background-color: #d32f2f; color: white; border: none; padding: 12px; margin-top: 15px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
        th { color: #ff5252; }
        tr:hover { background-color: #2a2a2a; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; text-transform: uppercase; font-weight: bold; }
        .nebula { background-color: #2e7d32; color: #fff; }
        .galaxy { background-color: #1565c0; color: #fff; }
        .cluster { background-color: #f57c00; color: #fff; }
        .planet { background-color: #7b1fa2; color: #fff; }
        .moon { background-color: #c2185b; color: #fff; }
        .easy { color: #4caf50; font-weight: bold; }
        .medium { color: #ff9800; font-weight: bold; }
        .hard { color: #f44336; font-weight: bold; }
        .eyepiece-badge { background-color: #333; border: 1px solid #ff5252; color: #ff5252; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .time-badge { background-color: #222; border: 1px solid #4caf50; color: #4caf50; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .reason-text { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <h1>Planificateur de Cibles SkyHopper</h1>

    <div class="card" style="border: 1px solid #444;">
        <h2>Catalogue & Éphémérides</h2>
        <p id="dbStatus">Chargement du catalogue en cours...</p>
    </div>

    <div class="card">
        <h2>Paramètres de l'observateur</h2>

        <div class="row">
            <div style="flex: 2;">
                <label>Date d'observation :</label>
                <div class="date-group">
                    <select id="obsDay" onchange="recalculate()"></select>
                    <select id="obsMonth" onchange="recalculate()">
                        <option value="0">Jan</option>
                        <option value="1">Fév</option>
                        <option value="2">Mar</option>
                        <option value="3">Avr</option>
                        <option value="4">Mai</option>
                        <option value="5">Juin</option>
                        <option value="6">Juil</option>
                        <option value="7">Aoû</option>
                        <option value="8">Sep</option>
                        <option value="9">Oct</option>
                        <option value="10">Nov</option>
                        <option value="11">Déc</option>
                    </select>
                    <select id="obsYear" onchange="recalculate()"></select>
                </div>
            </div>
            <div>
                <label for="startTime">Début :</label>
                <input type="time" id="startTime" value="23:00" onchange="recalculate()">
            </div>
            <div>
                <label for="endTime">Fin :</label>
                <input type="time" id="endTime" value="04:00" onchange="recalculate()">
            </div>
        </div>
        
        <label for="aperture">Diamètre du télescope (mm) :</label>
        <input type="number" id="aperture" value="150" onchange="recalculate()">

        <label for="focal">Longueur focale télescope (mm) :</label>
        <input type="number" id="focal" value="750" onchange="recalculate()">

        <label for="eyepieces">Vos oculaires disponibles (focales en mm) :</label>
        <input type="text" id="eyepieces" value="25, 10, 6" placeholder="ex: 25, 10, 6" onchange="recalculate()">

        <label for="bortle">Indice de Bortle du ciel (1 à 9) :</label>
        <select id="bortle" onchange="recalculate()">
            <option value="1">1 - Ciel exceptionnel</option>
            <option value="2">2 - Ciel très sombre</option>
            <option value="3">3 - Ciel rural</option>
            <option value="4">4 - Transition rurale/suburbaine</option>
            <option value="5">5 - Ciel suburbain</option>
            <option value="6">6 - Suburbain lumineux</option>
            <option value="7">7 - Transition suburbaine/urbaine</option>
            <option value="8" selected>8 - Ciel de ville</option>
            <option value="9">9 - Ciel de centre-ville</option>
        </select>

        <label for="targetTypeFilter">Type de cible préféré :</label>
        <select id="targetTypeFilter" onchange="recalculate()">
            <option value="all">Tous les types d'objets (NGC, Planètes, Lune)</option>
            <option value="planet" selected>Planètes & Lune uniquement</option>
            <option value="nebula">Nébuleuses uniquement</option>
            <option value="galaxy">Galaxies uniquement</option>
            <option value="cluster">Amas d'étoiles uniquement</option>
        </select>

        <label for="minAlt">Hauteur minimale (degrés) :</label>
        <input type="number" id="minAlt" value="30" onchange="recalculate()">

        <button onclick="calculateVisibleTargets()">Géolocaliser & Lancer le calcul</button>
    </div>

    <div class="card">
        <h2>Cibles recommandées (<span id="targetCount">0</span>)</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Type</th>
                    <th>Mag</th>
                    <th>Taille</th>
                    <th>Haut. Max</th>
                    <th>Moment Idéal</th>
                    <th>Oculaire idéal</th>
                    <th>Visibilité</th>
                    <th>Diagnostic</th>
                </tr>
            </thead>
            <tbody id="targetList">
                <tr><td colspan="10">Chargement en cours...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="visibility_filter.js"></script>
    <script>
        let allTargets = [];
        let userLat = 48.85;
        let userLon = 2.35;

        function initDateSelector() {
            const daySelect = document.getElementById('obsDay');
            const yearSelect = document.getElementById('obsYear');
            const monthSelect = document.getElementById('obsMonth');
            const now = new Date();

            daySelect.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = i < 10 ? '0' + i : i;
                daySelect.appendChild(opt);
            }

            yearSelect.innerHTML = '';
            const currentYear = now.getFullYear();
            for (let i = currentYear; i <= currentYear + 2; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = i;
                yearSelect.appendChild(opt);
            }

            daySelect.value = now.getDate();
            monthSelect.value = now.getMonth();
            yearSelect.value = currentYear;
        }

        // Calcul astronomique amélioré pour le Système Solaire (Planètes + Lune)
        function getSolarSystemBodies(date) {
            const d = (date - new Date(2000, 0, 1, 12, 0, 0)) / 86400000; // Jours depuis J2000.0
            
            // Éléments orbitaux moyens (Longitude moyenne L et longitude du périhélie p)
            const bodies = [
                { id: 'VENUS', name: 'Vénus', N: 210.6644, i: 3.3947, w: 54.884, a: 0.72333, L: 181.9798, M_n: 1.60213034, mag: -4.0, size: 15, type: 'planet' },
                { id: 'MARS', name: 'Mars', N: 49.5574, i: 1.8497, w: 286.5016, a: 1.52368, L: 355.4533, M_n: 0.52403838, mag: 1.0, size: 8, type: 'planet' },
                { id: 'JUPITER', name: 'Jupiter', N: 100.4542, i: 1.3033, w: 273.8777, a: 5.20256, L: 34.3515, M_n: 0.0830853, mag: -2.2, size: 40, type: 'planet' },
                { id: 'SATURNE', name: 'Saturne', N: 113.6634, i: 2.4886, w: 339.3939, a: 9.55475, L: 50.0774, M_n: 0.0334441, mag: 0.5, size: 18, type: 'planet' }
            ];

            // Soleil (référence)
            const g = (357.529 + 0.9856003 * d) % 360;
            const q = (280.459 + 0.98564736 * d) % 360;
            const L_sun = (q + 1.915 * Math.sin(g * Math.PI/180) + 0.020 * Math.sin(2 * g * Math.PI/180)) % 360;
            const sunRA = L_sun;
            const sunDec = 23.44 * Math.sin(L_sun * Math.PI/180);

            const results = [];

            bodies.forEach(b => {
                let M = (b.L - b.w + b.M_n * d) % 360;
                if (M < 0) M += 360;
                // Position apparente approchée basée sur la longitude héliocentrique
                let apparentLon = (b.L + b.M_n * d * 50) % 360; 
                if (apparentLon < 0) apparentLon += 360;

                let ra = (sunRA + apparentLon) / 1.5; 
                let dec = sunDec + (Math.sin(apparentLon * Math.PI/180) * 15);

                results.push({
                    id: b.id,
                    name: b.name,
                    type: b.type,
                    ra: (ra + 360) % 360,
                    dec: Math.max(-89, Math.min(89, dec)),
                    mag: b.mag,
                    size_maj: b.size / 60.0,
                    size_min: b.size / 60.0,
                    surfMag: 10.0
                });
            });

            // Calcul de la Lune
            let moonAge = (d % 29.53) / 29.53; // Cycle lunaire
            let moonLon = (L_sun + moonAge * 360) % 360;
            let moonRA = moonLon;
            let moonDec = sunDec + Math.sin(moonLon * Math.PI/180) * 18;
            let phasePercent = Math.round((1 - Math.cos(moonAge * 2 * Math.PI)) * 50);

            results.push({
                id: 'LUNE',
                name: `Lune (${phasePercent}%)`,
                type: 'moon',
                ra: moonRA,
                dec: Math.max(-89, Math.min(89, moonDec)),
                mag: -11.0,
                size_maj: 30.0, // ~30 minutes d'arc
                size_min: 30.0,
                surfMag: 5.0
            });

            return results;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initDateSelector();

            const localData = localStorage.getItem('skyhopper_ngc_db');
            if (localData) {
                allTargets = JSON.parse(localData);
                document.getElementById('dbStatus').innerHTML = `<b>Base prête !</b> (${allTargets.length} objets NGC + Système Solaire).`;
                document.getElementById('dbStatus').style.color = '#4caf50';
                recalculate();
            } else {
                document.getElementById('dbStatus').innerText = "Téléchargement automatique du catalogue NGC...";
                try {
                    const response = await fetch('NGC.csv');
                    if (!response.ok) throw new Error("Fichier introuvable");
                    const csvText = await response.text();
                    
                    allTargets = parseOpenNGC(csvText);
                    localStorage.setItem('skyhopper_ngc_db', JSON.stringify(allTargets));
                    
                    document.getElementById('dbStatus').innerHTML = `<b>Base prête !</b> (${allTargets.length} objets chargés).`;
                    document.getElementById('dbStatus').style.color = '#4caf50';
                    recalculate();
                } catch (err) {
                    document.getElementById('dbStatus').innerHTML = `<b>Erreur :</b> Impossible de charger NGC.csv automatiquement.`;
                    document.getElementById('dbStatus').style.color = '#f44336';
                }
            }
        });

        function parseOpenNGC(csvText) {
            const lines = csvText.split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(';').map(h => h.trim().toLowerCase());
            
            const idxName = headers.indexOf('name');
            const idxType = headers.indexOf('type');
            const idxRA = headers.indexOf('ra');
            const idxDec = headers.indexOf('dec');
            const idxMaj = headers.indexOf('majax');
            const idxMin = headers.indexOf('minax');
            const idxBMag = headers.indexOf('b-mag');
            const idxVMag = headers.indexOf('v-mag');
            const idxCommon = headers.indexOf('common names');

            const targets = [];
            const cleanNum = (val) => (!val ? NaN : parseFloat(val.trim().replace(',', '.')));

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(';');

                const name = cols[idxName] ? cols[idxName].trim() : '';
                const typeRaw = cols[idxType] ? cols[idxType].trim().toLowerCase() : '';
                const raStr = cols[idxRA] ? cols[idxRA].trim() : '';
                const decStr = cols[idxDec] ? cols[idxDec].trim() : '';

                if (!raStr || !decStr || !name) continue;

                let maj = idxMaj !== -1 ? cleanNum(cols[idxMaj]) : NaN;
                let min = idxMin !== -1 ? cleanNum(cols[idxMin]) : NaN;
                let vMag = idxVMag !== -1 ? cleanNum(cols[idxVMag]) : NaN;
                let bMag = idxBMag !== -1 ? cleanNum(cols[idxBMag]) : NaN;
                let mag = !isNaN(vMag) ? vMag : (!isNaN(bMag) ? bMag : NaN);
                if (isNaN(mag)) continue;

                let type = 'cluster';
                if (typeRaw.includes('neb') || typeRaw.includes('pn') || typeRaw.includes('snr') || typeRaw.includes('hii')) {
                    type = 'nebula';
                } else if (typeRaw.includes('galaxy') || typeRaw.includes('gal')) {
                    type = 'galaxy';
                }

                if (isNaN(maj) || maj <= 0) maj = 0.1;
                if (isNaN(min) || min <= 0) min = maj;

                const raParts = raStr.split(':').map(Number);
                const raDeg = ((raParts[0] || 0) + (raParts[1] || 0)/60 + (raParts[2] || 0)/3600) * 15;

                const decParts = decStr.split(':');
                const decSign = decStr.startsWith('-') ? -1 : 1;
                const decDeg = decSign * (Math.abs(parseFloat(decParts[0]) || 0) + (parseFloat(decParts[1]) || 0)/60 + (parseFloat(decParts[2]) || 0)/3600);

                const areaArcSec = Math.PI * (maj / 2.0) * (min / 2.0) * 3600.0;
                let surfMag = mag + 2.5 * Math.log10(areaArcSec);

                const commonName = (idxCommon !== -1 && cols[idxCommon] && cols[idxCommon].trim() !== '') 
                    ? cols[idxCommon].split(',')[0].trim() 
                    : name;

                targets.push({
                    id: name,
                    name: commonName,
                    type: type,
                    ra: raDeg,
                    dec: decDeg,
                    mag: Math.round(mag * 10) / 10,
                    size_maj: Math.round(maj * 10) / 10,
                    size_min: Math.round(min * 10) / 10,
                    surfMag: Math.round(surfMag * 10) / 10
                });
            }
            return targets;
        }

        function getObservationDates() {
            const day = parseInt(document.getElementById('obsDay').value);
            const month = parseInt(document.getElementById('obsMonth').value);
            const year = parseInt(document.getElementById('obsYear').value);

            const startStr = document.getElementById('startTime').value || "23:00";
            const endStr = document.getElementById('endTime').value || "04:00";

            const [startH, startM] = startStr.split(':').map(Number);
            const [endH, endM] = endStr.split(':').map(Number);

            let startDate = new Date(year, month, day, startH, startM);
            let endDate = new Date(year, month, day, endH, endM);

            if (endDate <= startDate) endDate.setDate(endDate.getDate() + 1);

            const midTime = startDate.getTime() + (endDate.getTime() - startDate.getTime()) / 2;
            return { start: startDate, mid: new Date(midTime), end: endDate };
        }

        function processTargets(filter, lat, lon, minAlt) {
            const aperture = parseFloat(document.getElementById('aperture').value) || 150;
            const focal = parseFloat(document.getElementById('focal').value) || 750;
            const bortle = parseInt(document.getElementById('bortle').value) || 8;
            const selectedType = document.getElementById('targetTypeFilter').value;

            const rawEyepieces = document.getElementById('eyepieces').value;
            const eyepieces = rawEyepieces.split(',').map(e => parseFloat(e.trim())).filter(e => !isNaN(e) && e > 0);
            if (eyepieces.length === 0) eyepieces.push(25);

            const { start: dateStart, mid: dateMid, end: dateEnd } = getObservationDates();

            const solarSystem = getSolarSystemBodies(dateMid);
            const combinedTargets = [...allTargets, ...solarSystem];

            const processedTargets = [];

            combinedTargets.forEach(target => {
                if (selectedType === 'planet' && target.type !== 'planet' && target.type !== 'moon') return;
                if (selectedType !== 'all' && selectedType !== 'planet' && target.type !== selectedType) return;
                if (!isFinite(target.ra) || !isFinite(target.dec)) return;

                const altStart = filter.calculateAltitude(target.ra, target.dec, lat, lon, dateStart);
                const altMid = filter.calculateAltitude(target.ra, target.dec, lat, lon, dateMid);
                const altEnd = filter.calculateAltitude(target.ra, target.dec, lat, lon, dateEnd);

                const maxAlt = Math.max(altStart, altMid, altEnd);
                if (maxAlt < minAlt) return;

                let bestTimeLabel = "Tout au long de la nuit";
                if (altStart >= altMid && altStart >= altEnd && (altStart - altEnd) > 5) {
                    bestTimeLabel = "Début de créneau";
                } else if (altEnd >= altStart && altEnd >= altMid && (altEnd - altStart) > 5) {
                    bestTimeLabel = "Fin de créneau";
                } else if (altMid > altStart && altMid > altEnd) {
                    bestTimeLabel = "Milieu de créneau";
                }

                let bestEyepiece = null;
                let bestScore = 999;
                let bestMag = 0;

                eyepieces.forEach(ep => {
                    const mag = focal / ep;
                    let score = target.mag;
                    if (target.type === 'planet' || target.type === 'moon') {
                        const optimalMag = target.type === 'moon' ? 80 : aperture * 1.2;
                        score = Math.abs(mag - optimalMag);
                    }

                    if (score < bestScore) {
                        bestScore = score;
                        bestEyepiece = ep;
                        bestMag = Math.round(mag);
                    }
                });

                if (bestEyepiece !== null) {
                    let label = "Incontournable";
                    let reason = "Cible claire.";
                    if (target.type === 'planet') {
                        label = "Planète majeure";
                        reason = `Idéal en fort grossissement (${bestMag}x).`;
                    } else if (target.type === 'moon') {
                        label = "Sélène / Lune";
                        reason = "Détails des cratères visibles.";
                    }

                    processedTargets.push({
                        ...target,
                        alt: Math.round(maxAlt),
                        bestTimeLabel: bestTimeLabel,
                        bestEyepiece: bestEyepiece,
                        visibilityIndex: (target.type === 'planet' || target.type === 'moon') ? 0 : bestScore,
                        difficultyLabel: label,
                        difficultyClass: 'easy',
                        reason: reason
                    });
                }
            });

            processedTargets.sort((a, b) => a.visibilityIndex - b.visibilityIndex);

            document.getElementById('targetCount').innerText = processedTargets.length;
            const tbody = document.getElementById('targetList');
            tbody.innerHTML = '';

            if (processedTargets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10">Aucun objet visible avec ces critères.</td></tr>';
                return;
            }

            processedTargets.slice(0, 100).forEach(target => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${target.id}</b></td>
                    <td>${target.name}</td>
                    <td><span class="tag ${target.type}">${target.type}</span></td>
                    <td>${target.mag}</td>
                    <td>${target.type === 'planet' || target.type === 'moon' ? '~' + Math.round(target.size_maj*60) + '"' : target.size_maj + "'"}</td>
                    <td>${target.alt}°</td>
                    <td><span class="time-badge">${target.bestTimeLabel}</span></td>
                    <td><span class="eyepiece-badge">${target.bestEyepiece} mm</span></td>
                    <td><span class="${target.difficultyClass}">${target.difficultyLabel}</span></td>
                    <td><span class="reason-text">${target.reason}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function recalculate() {
            if (allTargets.length === 0) return;
            const aperture = parseFloat(document.getElementById('aperture').value);
            const focal = parseFloat(document.getElementById('focal').value);
            const bortle = parseInt(document.getElementById('bortle').value);
            const minAlt = parseFloat(document.getElementById('minAlt').value);

            const filter = new TargetPlanner(aperture, focal, 25, bortle);
            processTargets(filter, userLat, userLon, minAlt);
        }

        function calculateVisibleTargets() {
            if (allTargets.length === 0) {
                alert("Chargement du catalogue en cours...");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; recalculate(); },
                (err) => { recalculate(); }
            );
        }
    </script>
</body>
</html>
